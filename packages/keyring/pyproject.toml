[project]
name = "xknx-keyring"
version = "0.1.0"
description = "XKNX keyring library"
requires-python = ">=3.12"
license = "GPL-2.0-only"
dependencies = [
    "xknx-models",
    "xsdata>=24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xknxmono"]
