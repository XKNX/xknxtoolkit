[project]
name = "xknxtoolkit"
version = "0.1.0"
description = "XKNX toolkit monorepo"
requires-python = ">=3.12"
dependencies = [
    "xknx-models",
    "xknx-product",
    "xknx-project",
    "xknx-keyring",
    "xknx-catalog",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "pyright>=1.1",
    "structlog>=24.0.0",  # injected logger type for xknx-models converter; no runtime dep there
]

[tool.pytest.ini_options]
testpaths = ["packages"]
asyncio_mode = "auto"

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
xknx-models = { workspace = true }
xknx-product = { workspace = true }
xknx-project = { workspace = true }
xknx-keyring = { workspace = true }
knx-gui = { workspace = true }
xknx-catalog = { workspace = true }
