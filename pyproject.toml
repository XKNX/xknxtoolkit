[project]
name = "xknxtoolkit"
version = "0.1.0"
description = "XKNX toolkit monorepo"
requires-python = ">=3.12"
license = "GPL-2.0-only"
dependencies = [
    "xknx-models",
    "xknx-product",
    "xknx-project",
    "xknx-keyring",
    "xknx-catalog",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "pyright>=1.1",
    "structlog>=24.0.0",  # injected logger type for xknx-models converter; no runtime dep there
]

[tool.pytest.ini_options]
testpaths = ["packages"]
asyncio_mode = "auto"

# CI runs three separate pytest invocations (root packages, apps/knx-gui unit
# tests, apps/knx-gui e2e tests) from two different working directories, then
# combines their coverage data into one report - see .github/workflows/ci.yml's
# "coverage" job. `--cov` is always passed an absolute (`$GITHUB_WORKSPACE`-
# anchored) path so the same file is recorded identically regardless of which
# job/cwd measured it, which is what makes `coverage combine` line them up
# without any [tool.coverage.paths] remapping.
[tool.coverage.run]
branch = true
parallel = true
omit = [
    "*/files/*",
    "*/intermediate/*",
    "*/tests/*",
    "*/testing/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
]

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
xknx = { git = "https://github.com/XKNX/xknx.git", branch = "main" }
xknx-models = { workspace = true }
xknx-product = { workspace = true }
xknx-project = { workspace = true }
xknx-keyring = { workspace = true }
knx-gui = { workspace = true }
xknx-catalog = { workspace = true }
