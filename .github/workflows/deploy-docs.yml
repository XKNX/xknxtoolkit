name: Deploy docs

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - "packages/*/docs/**"
      - "packages/*/src/**"
      - "packages/*/CHANGELOG.md"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      # Plain `uv sync` (not --all-packages): fumapy-generate only introspects
      # packages/*, so there's no need to install apps/knx-gui (imgui-bundle etc).
      - run: uv sync

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        # postinstall pip-installs fumadocs-python into ../.venv, so uv sync
        # above must run first.
        run: npm ci

      - name: Generate docs from Python API
        working-directory: website
        run: npm run generate:docs

      - name: Install Vercel CLI
        run: npm install -g vercel@59.25.4

      - name: Pull Vercel project settings
        working-directory: website
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build for Vercel
        working-directory: website
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output
        working-directory: website
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
