name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run ruff check
      - run: uv run ruff format --check

  typecheck:
    name: Type check (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run pyright

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv sync --all-packages
      # Both `coverage run` calls below name the root pyproject.toml explicitly
      # via --rcfile: coverage.py's config discovery only looks in the current
      # directory, so the apps/knx-gui one (cwd for the second call) would
      # otherwise pick up that directory's own (coverage-config-less)
      # pyproject.toml instead and silently drop [tool.coverage.run]'s
      # parallel = true - confirmed empirically. --source is an absolute
      # ($GITHUB_WORKSPACE-anchored) path in both, and parallel = true gives
      # each a uniquely-suffixed .coverage.* data file - see the "coverage"
      # job, which combines these with e2e-tests' into one report. Plain
      # `pytest --cov=...` was tried first and does *not* honor parallel the
      # same way `coverage run` does - also confirmed empirically.
      - run: |
          uv run coverage run --rcfile="$GITHUB_WORKSPACE/pyproject.toml" \
            --source="$GITHUB_WORKSPACE/packages" -m pytest
      - name: Test apps/knx-gui
        working-directory: apps/knx-gui
        # Excludes src/knx_gui/testing: those are the e2e tests, run separately below.
        run: |
          uv run coverage run --rcfile="$GITHUB_WORKSPACE/pyproject.toml" \
            --source="$GITHUB_WORKSPACE/apps/knx-gui/src/knx_gui" \
            -m pytest src/knx_gui --ignore=src/knx_gui/testing -v
      # `coverage combine <dir>` (in the "coverage" job) does not recurse into
      # subdirectories - confirmed empirically - so both .coverage.* sets are
      # flattened into one directory here before upload, rather than relying
      # on download-artifact's merge-multiple to flatten apps/knx-gui/'s nesting.
      # The directory lives outside packages/ and apps/ deliberately: either
      # would match a [tool.uv.workspace] members glob and break `uv run` in
      # every step after it - confirmed empirically.
      - name: Collect coverage data
        run: |
          mkdir -p "$GITHUB_WORKSPACE/coverage-data"
          mv .coverage.* apps/knx-gui/.coverage.* "$GITHUB_WORKSPACE/coverage-data/"
      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-data-unit-tests
          path: coverage-data/
          include-hidden-files: true
          if-no-files-found: error

  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - name: Test apps/knx-gui (Dear ImGui Test Engine)
        working-directory: apps/knx-gui
        # These drive the real app end-to-end and open a real (offscreen) GL window,
        # so they need a display and a GL context - xvfb provides the former, mesa's
        # llvmpipe the latter (software rendering; no GPU on this runner).
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
          xvfb-run -a uv run coverage run --rcfile="$GITHUB_WORKSPACE/pyproject.toml" \
            --source="$GITHUB_WORKSPACE/apps/knx-gui/src/knx_gui" \
            -m pytest src/knx_gui/testing -v
      # See unit-tests' "Collect coverage data" step for why this directory
      # is $GITHUB_WORKSPACE-anchored rather than apps/knx-gui-relative.
      - name: Collect coverage data
        working-directory: apps/knx-gui
        run: |
          mkdir -p "$GITHUB_WORKSPACE/coverage-data"
          mv .coverage.* "$GITHUB_WORKSPACE/coverage-data/"
      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-data-e2e-tests
          path: coverage-data/
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: true
      # Absolute --source paths (see unit-tests/e2e-tests above) mean every
      # data file already agrees on file paths, so this combines packages/
      # and apps/knx-gui/ coverage from all three test runs into one dataset
      # - no [tool.coverage.paths] remapping needed.
      - run: uv run coverage combine --rcfile=pyproject.toml coverage-data
      - run: uv run coverage report --rcfile=pyproject.toml
      - run: uv run coverage html --rcfile=pyproject.toml
      - run: uv run coverage xml --rcfile=pyproject.toml
      - name: Add to job summary
        run: uv run coverage report --rcfile=pyproject.toml --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-html-report
          path: htmlcov/
      # Decrease gate (codecov/project, codecov/patch) and the PR diff comment
      # are configured in codecov.yml and posted by Codecov itself once it
      # receives this upload - nothing else to wire up on this side. Needs the
      # Codecov GitHub App installed on the repo (github.com/apps/codecov) -
      # not something a workflow run can do - so this step is harmless but a
      # no-op until that's done. fail_ci_if_error is deliberately false: an
      # upload problem on Codecov's end (or the App not being installed yet)
      # shouldn't turn every PR's CI red over a reporting step.
      - uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

  build:
    name: Build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv build --all-packages
