name: Deploy docs to Vercel
description: >-
  Generates the website's Python API docs and deploys the Next.js site to
  Vercel as a prebuilt deployment (production or preview).

inputs:
  vercel-token:
    description: Vercel API token
    required: true
  vercel-org-id:
    description: Vercel org/team ID
    required: true
  vercel-project-id:
    description: Vercel project ID
    required: true
  production:
    description: Deploy as a production deployment instead of a preview
    required: false
    default: "false"

outputs:
  url:
    description: The deployed URL
    value: ${{ steps.deploy.outputs.url }}

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      with:
        enable-cache: true

    # Plain `uv sync` (not --all-packages): fumapy-generate only introspects
    # packages/*, so there's no need to install apps/knx-gui (imgui-bundle etc).
    - shell: bash
      run: uv sync

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: website/package-lock.json

    - name: Install website dependencies
      shell: bash
      working-directory: website
      # postinstall pip-installs fumadocs-python into ../.venv, so uv sync
      # above must run first.
      run: npm ci

    - name: Generate docs from Python API
      shell: bash
      working-directory: website
      run: npm run generate:docs

    - name: Install Vercel CLI
      shell: bash
      run: npm install -g vercel@59.25.4

    - name: Pull Vercel project settings
      shell: bash
      working-directory: website
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
      run: |
        environment=preview
        [ "${{ inputs.production }}" != "true" ] || environment=production
        vercel pull --yes --environment="$environment" --token="$VERCEL_TOKEN"

    - name: Build for Vercel
      shell: bash
      working-directory: website
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
      run: |
        flag=""
        [ "${{ inputs.production }}" != "true" ] || flag="--prod"
        vercel build $flag --token="$VERCEL_TOKEN"

    - name: Deploy prebuilt output
      id: deploy
      shell: bash
      working-directory: website
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
      run: |
        flag=""
        [ "${{ inputs.production }}" != "true" ] || flag="--prod"
        url=$(vercel deploy --prebuilt $flag --token="$VERCEL_TOKEN")
        echo "url=$url" >> "$GITHUB_OUTPUT"
        echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
