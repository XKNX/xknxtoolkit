[project]
name = "knx-gui"
version = "0.1.0"
description = "XKNX Toolkit - KNX node-based GUI"
requires-python = ">=3.12"
dependencies = [
    "imgui-bundle>=1.92.0",
]

[project.optional-dependencies]
dev = ["ruff", "pyright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knx_gui"]
