[project]
name = "knx-gui"
version = "0.1.0"
description = "XKNX Toolkit - KNX node-based GUI"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "imgui-bundle>=1.92.0",
    "sqlalchemy>=2.0.49",
    "structlog>=24.0.0",
    "xknx>=3.0.0",
    "xknx-catalog",
    "xknx-models",
    "xknx-product",
    "xknx-project",
]

[project.scripts]
generate-demo = "knx_gui.scripts.generate_demo:main"
generate-catalog = "knx_gui.scripts.generate_catalog:main"

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knx_gui"]

[tool.uv.sources]
# TEMPORARY: developing against the local xknx checkout instead of the
# published package. Remove this line (and re-run `uv lock`) to go back
# to the PyPI version.
xknx = { path = "../../../xknx", editable = true }
xknx-catalog = { workspace = true }
xknx-models = { workspace = true }
xknx-product = { workspace = true }
xknx-project = { workspace = true }
